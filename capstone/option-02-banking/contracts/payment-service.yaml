openapi: 3.0.3
info:
  title: Payment Service
  version: 1.0.0
  description: Capstone Option 2 — transfers with double-entry ledger (Decimal)
paths:
  /health:
    get:
      summary: Health
      responses:
        "200":
          description: OK
  /accounts:
    post:
      summary: Open account (requires APPROVED KYC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id: { type: string }
                currency: { type: string, default: USD }
                initial_balance: { type: string, example: "100.00" }
      responses:
        "201":
          description: Created
        "403":
          description: KYC not approved
  /transfers:
    post:
      summary: Transfer between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_account_id, to_account_id, amount]
              properties:
                from_account_id: { type: string }
                to_account_id: { type: string }
                amount: { type: string, example: "50.00" }
      responses:
        "201":
          description: Completed + PaymentPlaced event
        "400":
          description: Insufficient funds / validation
  /transfers/{transfer_id}/ledger:
    get:
      summary: Double-entry ledger lines
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: DEBIT + CREDIT entries
