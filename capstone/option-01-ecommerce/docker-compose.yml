# Capstone Option 1 — E-Commerce (course services + inventory)
services:
  user-service:
    build: ../../starters/python/user-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:////data/users.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
    volumes:
      - user-data:/data

  product-service:
    build: ../../starters/python/product-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:////data/products.db
    volumes:
      - product-data:/data

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=sqlite:////data/inventory.db
      - PRODUCT_SERVICE_URL=http://product-service:8002
    volumes:
      - inventory-data:/data
    depends_on:
      - product-service

  order-service:
    build: ../../starters/python/order-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=sqlite:////data/orders.db
      - PRODUCT_SERVICE_URL=http://product-service:8002
      - INVENTORY_SERVICE_URL=http://inventory-service:8005
      - EVENT_PUBLISH_MODE=http
      - EVENT_HTTP_ENDPOINT=http://notification-service:8004/events
    volumes:
      - order-data:/data
    depends_on:
      - product-service
      - inventory-service
      - notification-service

  notification-service:
    build: ../../starters/python/notification-service
    ports:
      - "8004:8004"

volumes:
  user-data:
  product-data:
  inventory-data:
  order-data:
